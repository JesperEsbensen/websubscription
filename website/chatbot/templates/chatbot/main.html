{% extends 'base.html' %}
{% block title %}Chatbot - ESG-support{% endblock %}

{% block content %}
<div class="container-fluid my-4">
    <div class="row h-100">
        <!-- Left Column - Headers/Sidebar -->
        <div class="col-md-3 col-lg-3">
            <div class="card shadow-lg h-100">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-list"></i> Chat Sessions
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div class="list-group list-group-flush" id="chat-sessions">
                        <!-- Sessions will be loaded dynamically -->
                    </div>
                </div>
                <div class="card-footer">
                    <button class="btn btn-outline-primary btn-sm w-100" id="new-chat-btn">
                        <i class="bi bi-plus-circle"></i> New Chat
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column - Chat Dialog -->
        <div class="col-md-9 col-lg-9">
            <div class="card shadow-lg h-100">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0" id="chat-header">
                        <i class="bi bi-robot"></i> General Support
                    </h5>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-light btn-sm" id="clear-chat-btn">
                            <i class="bi bi-trash"></i> Clear
                        </button>
                        <button class="btn btn-outline-light btn-sm" id="export-chat-btn">
                            <i class="bi bi-download"></i> Export
                        </button>
                    </div>
                </div>
                
                <!-- Chat Messages Area -->
                <div class="card-body p-0" style="height: 60vh; overflow-y: auto;">
                    <div class="chat-messages p-3" id="chat-messages">
                        <!-- Messages will be loaded dynamically -->
                    </div>
                </div>

                <!-- Chat Input Area -->
                <div class="card-footer">
                    <form id="chat-form" class="d-flex gap-2">
                        <div class="flex-grow-1">
                            <div class="input-group">
                                <textarea class="form-control" id="message-input" rows="2" placeholder="Type your message here..." maxlength="1000"></textarea>
                                <button class="btn btn-primary" type="submit" id="send-btn">
                                    <i class="bi bi-send"></i>
                                </button>
                            </div>
                        </div>
                    </form>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <small class="text-muted">
                            <span id="char-count">0</span>/1000 characters
                        </small>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary" type="button" title="Attach file">
                                <i class="bi bi-paperclip"></i>
                            </button>
                            <button class="btn btn-outline-secondary" type="button" title="Voice message">
                                <i class="bi bi-mic"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Session Type Modal -->
<div class="modal fade" id="sessionTypeModal" tabindex="-1" aria-labelledby="sessionTypeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="sessionTypeModalLabel">Select Chat Type</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="list-group">
                    <button class="list-group-item list-group-item-action" data-session-type="general">
                        <div class="d-flex w-100 justify-content-between">
                            <h6 class="mb-1">General Support</h6>
                        </div>
                        <p class="mb-1 text-muted small">General questions and support</p>
                    </button>
                    <button class="list-group-item list-group-item-action" data-session-type="esg">
                        <div class="d-flex w-100 justify-content-between">
                            <h6 class="mb-1">ESG Guidance</h6>
                        </div>
                        <p class="mb-1 text-muted small">ESG compliance and best practices</p>
                    </button>
                    <button class="list-group-item list-group-item-action" data-session-type="technical">
                        <div class="d-flex w-100 justify-content-between">
                            <h6 class="mb-1">Technical Support</h6>
                        </div>
                        <p class="mb-1 text-muted small">Technical issues and troubleshooting</p>
                    </button>
                    <button class="list-group-item list-group-item-action" data-session-type="billing">
                        <div class="d-flex w-100 justify-content-between">
                            <h6 class="mb-1">Billing & Subscriptions</h6>
                        </div>
                        <p class="mb-1 text-muted small">Payment and subscription questions</p>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* Chat styling */
.chat-messages {
    background-color: #f8f9fa;
}

.message {
    max-width: 80%;
}

.user-message {
    margin-left: auto;
}

.bot-message {
    margin-right: auto;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.2rem;
}

.bot-avatar {
    background-color: var(--medium-green);
}

.user-avatar {
    background-color: var(--dark-green);
}

.message-content {
    background-color: white;
    padding: 12px 16px;
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

.user-message .message-content {
    background-color: var(--lightest-green);
    border: 1px solid var(--lighter-green);
}

.message-header {
    margin-bottom: 4px;
    font-size: 0.9rem;
}

.message-text {
    line-height: 1.4;
}

/* List group styling */
.list-group-item {
    border-left: none;
    border-right: none;
    border-radius: 0;
    transition: all 0.2s ease;
}

.list-group-item:hover {
    background-color: var(--lightest-green);
}

.list-group-item.active {
    background-color: var(--medium-green);
    border-color: var(--medium-green);
}

/* Loading spinner */
.loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Form styling within chat messages */
.form-message {
    background-color: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    padding: 16px;
    margin: 8px 0;
}

/* Submitted form data styling */
.submitted-form-data {
    background-color: #d4edda;
    border: 1px solid #c3e6cb;
    border-radius: 8px;
    padding: 16px;
    margin: 8px 0;
}

.submitted-form-data h4 {
    color: #155724;
    margin-bottom: 12px;
    font-size: 1.1rem;
}

.data-description {
    margin-bottom: 12px;
}

.data-description ul {
    margin-bottom: 0;
    padding-left: 20px;
}

.data-description li {
    margin-bottom: 4px;
}

.submitted-form-data small {
    color: #6c757d;
    font-size: 0.85rem;
}

.submitted-form-data code {
    background-color: #e9ecef;
    padding: 2px 4px;
    border-radius: 3px;
    font-size: 0.8rem;
}

.form-message h4 {
    color: var(--dark-green);
    margin-bottom: 12px;
    font-size: 1.1rem;
}

.chatbot-form .form-group {
    margin-bottom: 16px;
}

.chatbot-form .form-control {
    border-radius: 6px;
    border: 1px solid #ced4da;
    padding: 8px 12px;
    font-size: 0.9rem;
}

.chatbot-form .form-control:focus {
    border-color: var(--medium-green);
    box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
}

.chatbot-form .btn {
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 0.9rem;
}

.chatbot-form .form-check {
    margin-bottom: 8px;
}

.chatbot-form .form-check-input {
    margin-top: 0.25rem;
}

.chatbot-form .form-check-label {
    margin-left: 0.5rem;
    font-size: 0.9rem;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .col-md-3 {
        margin-bottom: 1rem;
    }
    
    .message {
        max-width: 95%;
    }
    
    .form-message {
        padding: 12px;
    }
    
    .submitted-form-data {
        padding: 12px;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const messageInput = document.getElementById('message-input');
    const chatForm = document.getElementById('chat-form');
    const chatMessages = document.getElementById('chat-messages');
    const charCount = document.getElementById('char-count');
    const sendBtn = document.getElementById('send-btn');
    const clearChatBtn = document.getElementById('clear-chat-btn');
    const newChatBtn = document.getElementById('new-chat-btn');
    const chatSessions = document.getElementById('chat-sessions');
    const chatHeader = document.getElementById('chat-header');
    const sessionTypeModal = new bootstrap.Modal(document.getElementById('sessionTypeModal'));
    
    let currentSessionId = null;
    let currentSessionType = 'general';

    // Initialize the chat
    initializeChat();

    // Character counter
    messageInput.addEventListener('input', function() {
        const count = this.value.length;
        charCount.textContent = count;
        
        if (count > 900) {
            charCount.style.color = '#dc3545';
        } else if (count > 800) {
            charCount.style.color = '#ffc107';
        } else {
            charCount.style.color = '#6c757d';
        }
    });

    // Handle form submission
    chatForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const message = messageInput.value.trim();
        
        if (message) {
            sendMessage(message);
        }
    });

    // Initialize chat
    async function initializeChat() {
        await loadSessions();
        if (currentSessionId) {
            await loadMessages(currentSessionId);
        }
    }

    // Load sessions from database
    async function loadSessions() {
        try {
            const response = await fetch('{% url "chatbot:get_sessions" %}');
            const data = await response.json();
            
            chatSessions.innerHTML = '';
            
            if (data.sessions.length === 0) {
                // Create default session if none exist
                await createSession('general');
                await loadSessions();
                return;
            }
            
            data.sessions.forEach(session => {
                const sessionElement = createSessionElement(session);
                chatSessions.appendChild(sessionElement);
                
                // Set first session as active
                if (!currentSessionId) {
                    currentSessionId = session.id;
                    currentSessionType = session.type;
                    sessionElement.classList.add('active');
                    chatHeader.innerHTML = `<i class="bi bi-robot"></i> ${session.title}`;
                }
            });
        } catch (error) {
            console.error('Error loading sessions:', error);
        }
    }

    // Create session element
    function createSessionElement(session) {
        const div = document.createElement('div');
        div.className = 'list-group-item list-group-item-action';
        div.dataset.sessionId = session.id;
        div.dataset.sessionType = session.type;
        
        div.innerHTML = `
            <div class="d-flex w-100 justify-content-between">
                <h6 class="mb-1">${session.title}</h6>
                <small>${session.last_message_time}</small>
            </div>
            <p class="mb-1 text-muted small">${session.message_count} messages</p>
        `;
        
        div.addEventListener('click', () => switchSession(session.id));
        
        return div;
    }

    // Switch to a different session
    async function switchSession(sessionId) {
        try {
            // Update active state
            document.querySelectorAll('#chat-sessions .list-group-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-session-id="${sessionId}"]`).classList.add('active');
            
            // Load messages for this session
            await loadMessages(sessionId);
            
            currentSessionId = sessionId;
        } catch (error) {
            console.error('Error switching session:', error);
        }
    }

    // Load messages for a session
    async function loadMessages(sessionId) {
        try {
            const response = await fetch(`{% url "chatbot:get_messages" 0 %}`.replace('0', sessionId));
            const data = await response.json();
            
            chatMessages.innerHTML = '';
            chatHeader.innerHTML = `<i class="bi bi-robot"></i> ${data.session.title}`;
            currentSessionType = data.session.type;
            
            data.messages.forEach(message => {
                addMessageToChat(message, false);
            });
            
            scrollToBottom();
        } catch (error) {
            console.error('Error loading messages:', error);
        }
    }

    // Send message to server
    async function sendMessage(content) {
        try {
            // Add user message immediately
            const userMessage = {
                type: 'user',
                content: content,
                created_at: getCurrentTime(),
                is_user: true
            };
            addMessageToChat(userMessage, false);
            
            // Clear input
            messageInput.value = '';
            charCount.textContent = '0';
            charCount.style.color = '#6c757d';
            
            // Show typing indicator
            const typingIndicator = addTypingIndicator();
            
            // Send to server
            const response = await fetch('{% url "chatbot:send_message" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken()
                },
                body: JSON.stringify({
                    session_id: currentSessionId,
                    message: content
                })
            });
            
            const data = await response.json();
            
            // Remove typing indicator
            typingIndicator.remove();
            
            if (data.success) {
                // Add bot response
                const botMessage = {
                    type: 'bot',
                    content: data.bot_message.content,
                    created_at: data.bot_message.created_at,
                    is_user: false
                };
                addMessageToChat(botMessage, false);
                
                // Update current session ID if it changed
                if (data.session_id !== currentSessionId) {
                    currentSessionId = data.session_id;
                    await loadSessions();
                }
            } else {
                addErrorMessage('Failed to send message. Please try again.');
            }
        } catch (error) {
            console.error('Error sending message:', error);
            addErrorMessage('Network error. Please check your connection.');
        }
    }

    // Add message to chat
    function addMessageToChat(message, animate = true) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${message.is_user ? 'user-message' : 'bot-message'} mb-3`;
        
        if (animate) {
            messageDiv.style.opacity = '0';
            messageDiv.style.transform = 'translateY(20px)';
        }
        
        if (message.is_user) {
            messageDiv.innerHTML = `
                <div class="d-flex justify-content-end">
                    <div class="flex-grow-1 me-3 text-end">
                        <div class="message-content">
                            <div class="message-header">
                                <small class="text-muted me-2">${message.created_at}</small>
                                <strong>You</strong>
                            </div>
                            <div class="message-text">${escapeHtml(message.content)}</div>
                        </div>
                    </div>
                    <div class="flex-shrink-0">
                        <div class="avatar user-avatar">
                            <i class="bi bi-person"></i>
                        </div>
                    </div>
                </div>
            `;
        } else {
            messageDiv.innerHTML = `
                <div class="d-flex">
                    <div class="flex-shrink-0">
                        <div class="avatar bot-avatar">
                            <i class="bi bi-robot"></i>
                        </div>
                    </div>
                    <div class="flex-grow-1 ms-3">
                        <div class="message-content">
                            <div class="message-header">
                                <strong>ESG Assistant</strong>
                                <small class="text-muted ms-2">${message.created_at}</small>
                            </div>
                            <div class="message-text">${renderMessageContent(message.content)}</div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        chatMessages.appendChild(messageDiv);
        
        // Add event listeners for forms in the message
        if (!message.is_user) {
            const forms = messageDiv.querySelectorAll('.chatbot-form');
            forms.forEach(form => {
                const formId = form.id.replace('chatbot-form-', '');
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    handleFormSubmission(this, formId);
                });
            });
        }
        
        if (animate) {
            setTimeout(() => {
                messageDiv.style.transition = 'all 0.3s ease';
                messageDiv.style.opacity = '1';
                messageDiv.style.transform = 'translateY(0)';
            }, 100);
        }
        
        scrollToBottom();
    }

    // Add typing indicator
    function addTypingIndicator() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message bot-message mb-3 typing-indicator';
        typingDiv.innerHTML = `
            <div class="d-flex">
                <div class="flex-shrink-0">
                    <div class="avatar bot-avatar">
                        <i class="bi bi-robot"></i>
                    </div>
                </div>
                <div class="flex-grow-1 ms-3">
                    <div class="message-content">
                        <div class="loading"></div>
                        <small class="text-muted">ESG Assistant is typing...</small>
                    </div>
                </div>
            </div>
        `;
        chatMessages.appendChild(typingDiv);
        scrollToBottom();
        return typingDiv;
    }

    // Add error message
    function addErrorMessage(text) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'alert alert-danger mt-2';
        errorDiv.textContent = text;
        chatMessages.appendChild(errorDiv);
        scrollToBottom();
    }

    // Create new session
    async function createSession(sessionType) {
        try {
            const response = await fetch('{% url "chatbot:create_session" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken()
                },
                body: JSON.stringify({
                    session_type: sessionType,
                    title: ''
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                currentSessionId = data.session.id;
                currentSessionType = data.session.type;
                await loadSessions();
                await loadMessages(currentSessionId);
            }
        } catch (error) {
            console.error('Error creating session:', error);
        }
    }

    // Clear chat
    clearChatBtn.addEventListener('click', async function() {
        if (confirm('Are you sure you want to clear the chat history?')) {
            try {
                const response = await fetch(`{% url "chatbot:clear_session" 0 %}`.replace('0', currentSessionId), {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': getCSRFToken()
                    }
                });
                
                if (response.ok) {
                    await loadMessages(currentSessionId);
                }
            } catch (error) {
                console.error('Error clearing chat:', error);
            }
        }
    });

    // New chat
    newChatBtn.addEventListener('click', function() {
        sessionTypeModal.show();
    });

    // Session type selection
    document.querySelectorAll('[data-session-type]').forEach(button => {
        button.addEventListener('click', function() {
            const sessionType = this.dataset.sessionType;
            sessionTypeModal.hide();
            createSession(sessionType);
        });
    });

    // Utility functions
    function getCurrentTime() {
        return new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function getCSRFToken() {
        return document.querySelector('[name=csrfmiddlewaretoken]').value;
    }

    // Render message content (handles forms and regular text)
    function renderMessageContent(content) {
        // Check if content contains form HTML
        if (content.includes('<form') && content.includes('chatbot-form')) {
            return content; // Return HTML as-is for forms
        }
        return escapeHtml(content); // Escape HTML for regular text
    }

    // Handle form submissions within chat
    function handleFormSubmission(formElement, formId) {
        const formData = new FormData(formElement);
        
        // Check if this is a file upload form
        const fileInput = formElement.querySelector('input[type="file"]');
        const isFileUpload = fileInput !== null;
        
        let requestOptions;
        
        if (isFileUpload) {
            // For file uploads, send FormData directly
            requestOptions = {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCSRFToken()
                },
                body: formData
            };
        } else {
            // For regular forms, collect data and send as JSON
            const data = {};
            for (let [key, value] of formData.entries()) {
                if (data[key]) {
                    // Handle multiple values (checkboxes)
                    if (Array.isArray(data[key])) {
                        data[key].push(value);
                    } else {
                        data[key] = [data[key], value];
                    }
                } else {
                    data[key] = value;
                }
            }
            
            requestOptions = {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken()
                },
                body: JSON.stringify({
                    form_data: data
                })
            };
        }
        
        // Submit form data
        fetch(`/chatbot/api/forms/${formId}/submit/`, requestOptions)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Replace the form with a description of the stored data
                replaceFormWithDataDescription(formElement, data);
            } else {
                // Add error message to chat
                const errorMessage = {
                    type: 'bot',
                    content: `❌ Error submitting form: ${data.error}`,
                    created_at: getCurrentTime(),
                    is_user: false
                };
                addMessageToChat(errorMessage, true);
            }
        })
        .catch(error => {
            console.error('Error submitting form:', error);
            const errorMessage = {
                type: 'bot',
                content: '❌ Network error while submitting form. Please try again.',
                created_at: getCurrentTime(),
                is_user: false
            };
            addMessageToChat(errorMessage, true);
        });
    }

    // Replace form with data description after successful submission
    function replaceFormWithDataDescription(formElement, responseData) {
        const formContainer = formElement.closest('.form-message');
        if (!formContainer) return;

        // Use the submitted data from the server response
        const submittedData = responseData.submitted_data || {};

        // Generate description of the stored data
        const dataDescription = generateDataDescription(responseData.form_title, submittedData);
        
        // Replace the form with the description
        formContainer.innerHTML = `
            <div class="submitted-form-data">
                <h4>✅ ${responseData.form_title} - Submitted</h4>
                <div class="data-description">
                    ${dataDescription}
                </div>
                <small class="text-muted">
                    <i class="bi bi-check-circle"></i> 
                    Data saved successfully to the database
                    ${responseData.submitted_data && responseData.submitted_data.file_path ? 
                        `<br><i class="bi bi-folder"></i> File saved to: <code>${responseData.submitted_data.file_path}</code>` : 
                        ''
                    }
                </small>
            </div>
        `;
    }

    // Generate a human-readable description of the submitted data
    function generateDataDescription(formTitle, data) {
        let description = `<p><strong>Form submitted:</strong> ${formTitle}</p>`;
        description += '<p><strong>Your responses:</strong></p><ul>';
        
        for (const [key, value] of Object.entries(data)) {
            const fieldLabel = getFieldLabel(key);
            let displayValue = value;
            
            if (Array.isArray(value)) {
                displayValue = value.join(', ');
            }
            
            // Special handling for file uploads
            if (key === 'file_name' && data.file_size && data.file_type) {
                const fileSize = formatFileSize(data.file_size);
                description += `<li><strong>Uploaded File:</strong> ${escapeHtml(displayValue)} (${fileSize}, ${data.file_type})</li>`;
                continue;
            } else if (key === 'file_size' || key === 'file_type' || key === 'file_path' || key === 'uploaded_at') {
                continue; // Skip these as they're handled with file_name
            }
            
            if (displayValue && displayValue.trim()) {
                description += `<li><strong>${fieldLabel}:</strong> ${escapeHtml(displayValue)}</li>`;
            }
        }
        
        description += '</ul>';
        return description;
    }

    // Format file size in human readable format
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Get human-readable field labels
    function getFieldLabel(fieldName) {
        const fieldLabels = {
            'esg_assessment': 'ESG Assessment',
            'company_name': 'Company Name',
            'industry': 'Industry',
            'esg_priorities': 'ESG Priorities',
            'contact_email': 'Contact Email',
            'company_size': 'Company Size',
            'reporting_timeline': 'Reporting Timeline',
            'document_upload': 'Document Upload',
            'file_name': 'File Name',
            'file_size': 'File Size',
            'file_type': 'File Type'
        };
        return fieldLabels[fieldName] || fieldName.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    }


    // Auto-resize textarea
    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // Enter to send (Shift+Enter for new line)
    messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            chatForm.dispatchEvent(new Event('submit'));
        }
    });
});
</script>
