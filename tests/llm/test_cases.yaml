- id: edge_very_long_question
  question: >
    Can you please explain in great detail every single aspect of the
    Corporate Sustainability Reporting Directive including its history,
    development, legislative process, scope, requirements, timelines,
    penalties, relationship with other EU regulations, impact on different
    sectors, implementation challenges, and future amendments?
  expected_answer: >
    The CSRD is an EU directive for sustainability reporting that expands
    reporting requirements to more companies. Key aspects include scope
    expansion, ESRS alignment, double materiality, assurance requirements,
    and phased implementation timelines.
  session_type: esg
  category: edge_case
  min_score: 0.4
  expect_answer: true
  tags: [edge_case, esg]
