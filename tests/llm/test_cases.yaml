# =============================================================================
# LLM Response Evaluation Test Cases
#
# Each test case defines:
#   id:              Unique identifier for the test case
#   question:        The question sent to the system
#   expected_answer: The reference answer to compare against
#   session_type:    RAG session type (general, esg, technical, billing)
#   category:        Test category for grouping/filtering
#   min_score:       Minimum composite score to pass (0.0 – 1.0)
#   expect_answer:   true = expects an answer, false = expects a rejection
#   tags:            Optional tags for filtering
# =============================================================================

# ---------------------------------------------------------------------------
# ESG / CSRD domain questions
# ---------------------------------------------------------------------------
- id: esg_csrd_definition
  question: "What is the CSRD?"
  expected_answer: >
    The Corporate Sustainability Reporting Directive (CSRD) is an EU directive
    that requires companies to report on their environmental, social, and
    governance (ESG) impacts. It expands the scope of sustainability reporting
    to include more companies and requires more detailed disclosures aligned
    with European Sustainability Reporting Standards (ESRS).
  session_type: esg
  category: esg_knowledge
  min_score: 0.6
  expect_answer: true
  tags: [esg, regulation, csrd]

- id: esg_double_materiality
  question: "What is double materiality in the context of ESG reporting?"
  expected_answer: >
    Double materiality is a concept in ESG reporting that requires companies
    to consider sustainability matters from two perspectives: (1) how
    sustainability issues affect the company's financial performance (financial
    materiality or outside-in), and (2) how the company's activities impact
    the environment and society (impact materiality or inside-out). The CSRD
    and ESRS standards require companies to apply double materiality when
    determining which sustainability topics to report on.
  session_type: esg
  category: esg_knowledge
  min_score: 0.6
  expect_answer: true
  tags: [esg, materiality, reporting]

- id: esg_scope_3_emissions
  question: "What are Scope 3 emissions?"
  expected_answer: >
    Scope 3 emissions are indirect greenhouse gas emissions that occur in a
    company's value chain, both upstream and downstream. They include emissions
    from purchased goods and services, business travel, employee commuting,
    waste disposal, transportation, and the use and end-of-life treatment of
    sold products. Scope 3 typically represents the largest share of a
    company's carbon footprint.
  session_type: esg
  category: esg_knowledge
  min_score: 0.6
  expect_answer: true
  tags: [esg, emissions, climate]

# ---------------------------------------------------------------------------
# General / platform questions
# ---------------------------------------------------------------------------
- id: general_platform_features
  question: "What features does this platform offer?"
  expected_answer: >
    The platform offers user accounts with registration and email confirmation,
    subscription management through Stripe, profile management with two-factor
    authentication, a chatbot with AI-powered responses using RAG technology,
    document analysis capabilities, and ESG reporting guidance.
  session_type: general
  category: platform
  min_score: 0.5
  expect_answer: true
  tags: [general, platform]

- id: general_subscription_info
  question: "How do I subscribe to the service?"
  expected_answer: >
    You can subscribe by navigating to the subscription page, choosing a
    membership plan, and completing the checkout process through Stripe.
    After successful payment, your subscription will be activated and you
    will have access to premium features.
  session_type: billing
  category: platform
  min_score: 0.5
  expect_answer: true
  tags: [billing, subscription]

# ---------------------------------------------------------------------------
# Technical support questions
# ---------------------------------------------------------------------------
- id: tech_password_reset
  question: "How do I reset my password?"
  expected_answer: >
    You can reset your password by clicking the 'Forgot Password' link on the
    login page. An email with a password reset link will be sent to your
    registered email address. Click the link and follow the instructions to
    set a new password.
  session_type: technical
  category: technical_support
  min_score: 0.5
  expect_answer: true
  tags: [technical, password, account]

- id: tech_two_factor_setup
  question: "How do I set up two-factor authentication?"
  expected_answer: >
    To set up two-factor authentication, go to your profile settings and
    enable 2FA. You will be shown a QR code that you can scan with an
    authenticator app like Google Authenticator or Authy. After scanning,
    enter the verification code to confirm the setup. You will also receive
    recovery codes that can be used if you lose access to your authenticator.
  session_type: technical
  category: technical_support
  min_score: 0.5
  expect_answer: true
  tags: [technical, 2fa, security]

