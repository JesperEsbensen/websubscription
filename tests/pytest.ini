[tool:pytest]
DJANGO_SETTINGS_MODULE = tests.test_settings
addopts = --reuse-db --nomigrations --tb=short --strict-markers -v
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests
pythonpath = . website
markers =
    integration: Integration tests
    unit: Unit tests
    slow: Slow running tests
    external_api: Tests that require external API calls
    stripe: Tests that interact with Stripe API
    llm_eval: LLM response evaluation tests